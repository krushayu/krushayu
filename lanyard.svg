<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 680" width="100%" height="100%">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4FA3"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0C2E"/>
      <stop offset="100%" stop-color="#090611"/>
    </linearGradient>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#D946EF" flood-opacity="0.3"/>
    </filter>

    <style>
      @keyframes pendulumSwing {
        0% { transform: rotate(8deg); }
        50% { transform: rotate(-8deg); }
        100% { transform: rotate(8deg); }
      }
      @keyframes shinePass {
        0% { transform: translateX(-300px) skewX(-20deg); }
        100% { transform: translateX(600px) skewX(-20deg); }
      }
      .swing-group {
        transform-origin: 250px 0px;
        animation: pendulumSwing 4.5s ease-in-out infinite;
      }
      .shine-effect {
        animation: shinePass 3.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Anchored Top Strap Anchor -->
  <circle cx="250" cy="0" r="10" fill="#24103A"/>

  <g class="swing-group">
    <!-- Lanyard Straps -->
    <path d="M 235,0 L 210,180 L 230,180 L 245,0 Z" fill="url(#strapGrad)"/>
    <path d="M 265,0 L 290,180 L 270,180 L 255,0 Z" fill="url(#strapGrad)"/>

    <!-- Strap Text -->
    <text x="218" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" transform="rotate(85 218 100)" opacity="0.8">AAYUSH • WEB DEVELOPER</text>
    <text x="278" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" transform="rotate(-85 278 100)" opacity="0.8">KRUSHAYU • PORTFOLIO</text>

    <!-- Metal Hardware Clip -->
    <rect x="230" y="175" width="40" height="20" rx="4" fill="#B8AFC7"/>
    <circle cx="250" cy="205" r="12" fill="none" stroke="#B8AFC7" stroke-width="4"/>

    <!-- Main Hanging ID Card -->
    <g transform="translate(110, 220)" filter="url(#dropGlow)">
      <!-- Outer Plastic Shell -->
      <rect width="280" height="420" rx="18" fill="url(#cardBg)" stroke="rgba(255,79,163,0.5)" stroke-width="2"/>
      
      <!-- Top Slot for Clip -->
      <rect x="110" y="12" width="60" height="10" rx="5" fill="#090611"/>

      <!-- Avatar Ring -->
      <circle cx="140" cy="115" r="52" fill="none" stroke="url(#strapGrad)" stroke-width="3"/>
      
      <!-- Embedded Character Face Thumbnail -->
      <clipPath id="avatarClip">
        <circle cx="140" cy="115" r="48"/>
      </clipPath>
      <image clip-path="url(#avatarClip)" x="90" y="65" width="100" height="100" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="/>

      <!-- User Details -->
      <text x="140" y="200" fill="#F8F7FF" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Aayush</text>
      <text x="140" y="225" fill="#FF4FA3" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">WEB DEVELOPER</text>
      <text x="140" y="248" fill="#B8AFC7" font-family="'Courier New', monospace" font-size="13" text-anchor="middle">@krushayu</text>

      <!-- Glass Divider Line -->
      <line x1="30" y1="270" x2="250" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <!-- Barcode Accent -->
      <g transform="translate(45, 290)" fill="#D946EF">
        <rect x="0" width="3" height="40"/><rect x="6" width="6" height="40"/><rect x="15" width="2" height="40"/>
        <rect x="20" width="8" height="40"/><rect x="31" width="4" height="40"/><rect x="38" width="2" height="40"/>
        <rect x="43" width="7" height="40"/><rect x="53" width="3" height="40"/><rect x="60" width="5" height="40"/>
        <rect x="68" width="2" height="40"/><rect x="73" width="8" height="40"/><rect x="84" width="4" height="40"/>
        <rect x="91" width="6" height="40"/><rect x="100" width="2" height="40"/><rect x="105" width="7" height="40"/>
        <rect x="115" width="4" height="40"/><rect x="122" width="6" height="40"/><rect x="131" width="3" height="40"/>
        <rect x="137" width="8" height="40"/><rect x="148" width="2" height="40"/><rect x="153" width="5" height="40"/>
        <rect x="161" width="4" height="40"/><rect x="168" width="7" height="40"/><rect x="178" width="3" height="40"/>
        <rect x="184" width="6" height="40"/>
      </g>
      <text x="140" y="350" fill="#B8AFC7" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">VERIFIED PROFILE • KRUSHAYU.IN</text>

      <!-- Holographic Card Shine Sweep -->
      <g clip-path="inset(0 0 0 0 round 18px)">
        <rect class="shine-effect" x="0" y="0" width="80" height="420" fill="rgba(255,255,255,0.08)"/>
      </g>
    </g>
  </g>
</svg>
